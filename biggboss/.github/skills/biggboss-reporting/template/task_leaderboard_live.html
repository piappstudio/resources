<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigg Boss Tamil 10 - Task Leaderboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent),
                              radial-gradient(circle at bottom left, #0f172a, transparent);
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .show-badge {
            display: inline-block;
            background: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 60px;
            align-items: end;
        }

        .podium-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .podium-card.gold { border-color: var(--gold); transform: scale(1.05); z-index: 10; }
        .podium-card.silver { border-color: var(--silver); }
        .podium-card.bronze { border-color: var(--bronze); }

        .rank-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            border: 2px solid var(--bg);
        }

        .gold .rank-badge { background: var(--gold); color: #000; }
        .silver .rank-badge { background: var(--silver); color: #000; }
        .bronze .rank-badge { background: var(--bronze); color: #fff; }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: #334155;
            padding: 5px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .score {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 10px 0;
            color: var(--primary);
        }

        .leaderboard-table {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .row-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mini-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #334155;
            object-fit: cover;
        }

        .form-dots {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #334155;
        }
        .dot.win { background: var(--success); box-shadow: 0 0 5px var(--success); }
        .dot.loss { background: var(--danger); }
        .trend-up { color: var(--success); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="show-badge">Show ID: 6</div>
        <h1>Bigg Boss Tamil</h1>
        <p class="subtitle">Tamil | Season 10 | Week 2 Task Standings</p>
    </header>

    <div class="podium">
        <div class="podium-card silver">
            <div class="rank-badge">2</div>
            <div class="avatar"><img src="https://raw.githubusercontent.com/piappstudio/resources/main/biggboss/images/shows/tamil/season10/participants/16.png" alt="Kumaran"></div>
            <span class="name">Kumaran</span>
            <div class="score">2</div>
            <div class="subtitle">Wins</div>
        </div>

        <div class="podium-card gold">
            <div class="rank-badge">1</div>
            <div class="avatar"><img src="https://raw.githubusercontent.com/piappstudio/resources/main/biggboss/images/shows/tamil/season10/participants/18.png" alt="Mukesh.K"></div>
            <span class="name">Mukesh.K</span>
            <div class="score">3</div>
            <div class="subtitle">Wins</div>
        </div>

        <div class="podium-card bronze">
            <div class="rank-badge">3</div>
            <div class="avatar"><img src="https://raw.githubusercontent.com/piappstudio/resources/main/biggboss/images/shows/tamil/season10/participants/17.png" alt="Dhanya Pallath"></div>
            <span class="name">Dhanya Pallath</span>
            <div class="score">2</div>
            <div class="subtitle">Wins</div>
        </div>
    </div>

    <div class="leaderboard-table">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Participant</th>
                    <th>Participation</th>
                    <th>Wins</th>
                    <th>Recent Form</th>
                    <th>Trend</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>4</td>
                    <td>
                        <div class="row-info">
                            <img class="mini-avatar" src="https://raw.githubusercontent.com/piappstudio/resources/main/biggboss/images/shows/tamil/season10/participants/10.png" alt="Avinash Ashok">
                            <span>Avinash Ashok</span>
                        </div>
                    </td>
                    <td>5</td>
                    <td>2</td>
                    <td><div class="form-dots"><div class="dot win"></div><div class="dot loss"></div><div class="dot win"></div></div></td>
                    <td><span class="trend-up">▲</span></td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>
                        <div class="row-info">
                            <img class="mini-avatar" src="https://raw.githubusercontent.com/piappstudio/resources/main/biggboss/images/shows/tamil/season10/participants/2.png" alt="Shathiga">
                            <span>Shathiga</span>
                        </div>
                    </td>
                    <td>6</td>
                    <td>1</td>
                    <td><div class="form-dots"><div class="dot win"></div><div class="dot loss"></div><div class="dot loss"></div></div></td>
                    <td><span class="trend-up">▲</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
